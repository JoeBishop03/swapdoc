<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Stand-ins for common Microsoft fonts the server doesn't have, so a document
     in Aptos (Word's default since 2023) or Verdana doesn't come out in a serif
     font. Calibri, Cambria, Arial, Times New Roman and Courier New already have
     size-matched replacements (Carlito, Caladea, Liberation). -->
<fontconfig>
  <alias binding="same"><family>Aptos</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos Narrow</family><prefer><family>Liberation Sans Narrow</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Century Gothic</family><prefer><family>URW Gothic</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Trebuchet MS</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Garamond</family><prefer><family>EB Garamond</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Book Antiqua</family><prefer><family>P052</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Palatino Linotype</family><prefer><family>P052</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Comic Sans MS</family><prefer><family>Comic Neue</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
